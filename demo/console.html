<!DOCTYPE html>
<html lang="zh-lang">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营控制台 · SOD Phase 0</title>
<link rel="stylesheet" href="demo.css">
<style>
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px; flex: 1; align-items: start; }
  .sec-title { font-weight: 800; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .o-thumb { width: 56px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); }
  .act-btns { display: flex; gap: 8px; }
  .dev-mini { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: #fff; }
  .dev-mini .dm-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dev-mini .dm-dot.on { background: var(--mint); }
  .dev-mini .dm-dot.busy { background: var(--sun); animation: pulse 1.2s infinite; }
  .dev-mini .dm-name { font-size: 12.5px; font-weight: 700; }
  .dev-mini .dm-stat { font-size: 11px; color: var(--ink-3); }
  .empty { padding: 40px 20px; text-align: center; color: var(--ink-4); font-size: 13.5px; }
  .act-btns .btn { height: 30px; padding: 0 12px; font-size: 12px; }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="logo">贴</div>
    <div>
      <div class="t-title">运营控制台 <span id="act-name" style="color:var(--ink-3);font-weight:600"></span></div>
      <div class="t-sub">你的角色：现场工作人员 · 接单 → 选设备制作 → 核验取件码交付</div>
    </div>
    <div class="t-right">
      <span class="pill pill-live">实时</span>
      <a class="btn btn-sm" href="booth.html">摊位屏</a>
      <button class="btn btn-sm" onclick="doReset()">重置演示</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左：订单流 -->
    <div>
      <div class="card card-pad">
        <div class="sec-title">📋 订单流 <span class="pill pill-gray" id="cnt">0 单</span></div>
        <table class="dtable" id="otable">
          <thead><tr><th>下单时间</th><th>排队号</th><th>用户</th><th>设计稿</th><th>份数</th><th>状态</th><th>设备</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="empty" id="oempty">暂无订单——等观众扫码下单（左侧「摊位屏」的二维码）</div>
      </div>
    </div>

    <!-- 右：设备看板 -->
    <div>
      <div class="card card-pad" style="margin-bottom:16px;">
        <div class="sec-title">🖨️ 设备看板</div>
        <div style="display:flex;flex-direction:column;gap:10px;" id="dev-list"></div>
      </div>
      <div class="card card-pad">
        <div class="sec-title">📊 实时统计</div>
        <div class="stat-grid" style="grid-template-columns:1fr 1fr;gap:10px;">
          <div class="stat-card"><div class="s-num" id="s1" style="font-size:24px">0</div><div class="s-label">获客</div></div>
          <div class="stat-card"><div class="s-num" id="s2" style="font-size:24px">0</div><div class="s-label">订单</div></div>
          <div class="stat-card"><div class="s-num" id="s3" style="font-size:24px">0</div><div class="s-label">已取货</div></div>
          <div class="stat-card"><div class="s-num" id="s4" style="font-size:24px">0</div><div class="s-label">待取货</div></div>
        </div>
        <div style="font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:12px;">
          渠道归因：<span id="ch-label">—</span><br>
          手机号强制绑定（「下单强制可触达」）、手机页模拟推送
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 设备选择弹窗 -->
<div class="modal-mask" id="dev-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <div class="m-title">选择设备 · 派发任务</div>
      <button class="m-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--ink-3);margin-bottom:14px;line-height:1.7;">
        订单 <b id="dm-order" style="color:var(--ink)"></b> · 空闲设备排最前，全忙时任务数最少的排最前（演示：分配后自动模拟打印 8-14 秒/单）
      </div>
      <div id="dm-list"></div>
    </div>
  </div>
</div>

<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<script src="demo.js"></script>
<script>
/* 云端模式：本页驱动设备仿真泵（打印推进） */
SOD.startPump();

let current = null;      // 最新状态
let assignTarget = null; // 弹窗对应订单

function render(state) {
  current = state;
  document.getElementById('act-name').textContent = state.session ? '· ' + state.session.name : '';
  document.getElementById('ch-label').textContent = state.session ? state.session.ch : '—';
  const s = state.stats;
  document.getElementById('s1').textContent = s.customers;
  document.getElementById('s2').textContent = s.orders;
  document.getElementById('s3').textContent = s.picked;
  document.getElementById('s4').textContent = s.ready;

  /* 订单表 */
  const tbody = document.querySelector('#otable tbody');
  const list = state.orders;
  document.getElementById('oempty').hidden = list.length > 0;
  document.getElementById('otable').style.display = list.length ? '' : 'none';
  document.getElementById('cnt').textContent = list.length + ' 单';
  tbody.innerHTML = list.map(o => {
    const st = ORDER_STATUS[o.status];
    let act = '';
    if (o.status === 'pending') act = `<button class="btn btn-primary btn-sm" onclick="accept('${o.id}')">接单</button>`;
    else if (o.status === 'accepted') act = `<button class="btn btn-primary btn-sm" onclick="openAssign('${o.id}')">制作 →</button>`;
    else if (o.status === 'ready') act = `<button class="btn btn-sm" onclick="pickup('${o.id}')" style="border-color:var(--mint);color:var(--mint)">核码取件</button>`;
    const dev = o.device ? `<span class="pill pill-gray">${o.device}</span>` : '<span style="color:var(--ink-4)">—</span>';
    return `<tr>
      <td style="font-size:12px;color:var(--ink-3);white-space:nowrap">${fmtClock(o.createdAt)}</td>
      <td style="font-weight:800;font-family:monospace">${esc(o.queueNo)}</td>
      <td>${esc(o.nickname)}</td>
      <td style="display:flex;align-items:center;gap:8px;">${o.thumb ? `<img class="o-thumb" src="${o.thumb}">` : ''}<span style="font-size:12.5px">${esc(o.designName)}</span></td>
      <td>×${o.copies}</td>
      <td><span class="pill ${st.cls}">${st.text}</span></td>
      <td>${dev}</td>
      <td><div class="act-btns">${act}</div></td>
    </tr>`;
  }).join('');

  /* 设备看板 */
  document.getElementById('dev-list').innerHTML = state.devices.map(d => `
    <div class="dev-mini">
      <span class="dm-dot ${d.busy ? 'busy' : 'on'}"></span>
      <div>
        <div class="dm-name">${esc(d.name)}</div>
        <div class="dm-stat">${d.busy ? '正在打印 ' + esc(d.current || '') : '空闲'} · 已完成 ${d.done} 单</div>
      </div>
    </div>`).join('');
}

/* ---------- 动作 ---------- */
async function accept(id) { try { await SOD.acceptOrder(id); } catch (e) { toast('操作失败：' + e.message); } }
function openAssign(id) {
  assignTarget = current.orders.find(o => o.id === id);
  if (!assignTarget) return;
  document.getElementById('dm-order').textContent = assignTarget.queueNo + ' · ' + assignTarget.designName + ' ×' + assignTarget.copies;
  renderDevModal();
  document.getElementById('dev-modal').hidden = false;
}
function renderDevModal() {
  /* 排序：空闲在前；全忙则任务少在前 */
  const list = current.devices.slice().sort((a, b) => {
    if (a.busy !== b.busy) return a.busy ? 1 : -1;
    return a.load - b.load;
  });
  document.getElementById('dm-list').innerHTML = list.map(d => `
    <button class="dev-row" onclick="assign('${d.id}')">
      <div class="dr-icon ${d.busy ? 'busy' : 'idle'}">${d.busy ? '⏳' : '✅'}</div>
      <div>
        <div class="dr-name">${esc(d.name)}</div>
        <div class="dr-stat">${d.busy ? '占用中 · 队列 ' + d.load + ' 单（当前 ' + esc(d.current || '') + '）' : '空闲'} · 已完成 ${d.done} 单</div>
      </div>
      <span class="pill ${d.busy ? 'pill-sun' : 'pill-mint'} dr-tag">${d.busy ? '排队 ' + d.load : '空闲'}</span>
    </button>`).join('');
}
async function assign(deviceId) {
  try {
    await SOD.assignOrder(assignTarget.id, deviceId);
    closeModal();
    toast('已派发到 ' + deviceId + '，开始模拟打印');
  } catch (e) { closeModal(); toast('操作失败：' + e.message); }
}
async function pickup(id) {
  const code = prompt('请输入顾客出示的 4 位取件码（演示可随便填，错误会拦截）：', '');
  if (code === null) return;
  const r = await SOD.pickup(id, code);
  if (r.err) { toast('❌ ' + r.err); return; }
  toast('✅ 核验通过，已交付');
}
function closeModal() { document.getElementById('dev-modal').hidden = true; }
async function doReset() {
  if (!confirm('清空全部订单/获客数据，重新开始演示？')) return;
  await SOD.reset();
  toast('已重置');
}

subscribeEvents(render);
</script>
</body>
</html>
