<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的订单 · SOD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF7A45'/%3E%3Cpath d='M10 11h9l-7 9h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/theme-v2.css">
<style>
  .o-card { padding: 16px 18px; }
  .o-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .o-note { font-size: 12.5px; color: var(--ink-3); }
  .o-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  /* 自提单取货码徽标 */
  .o-pickup {
    display: inline-flex; align-items: baseline; gap: 6px; margin-top: 6px;
    padding: 4px 10px; border-radius: var(--r-xs); background: var(--brand-soft);
    font-size: 12px; color: var(--brand); font-weight: 700;
  }
  .o-pickup b { font-size: 15px; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  /* 移动端：tab 横滑、卡片动作按钮全宽 */
  @media (max-width: 760px) {
    .tabs { display: flex; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tabs .tab { flex: none; padding: 8px 14px; }
    .o-actions { flex-direction: column; }
    .o-actions .btn-sm { width: 100%; }
    .o-note { font-size: 11.5px; }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main class="container-narrow page">
  <h1 class="t-h1 mb-16">我的订单</h1>

  <div class="tabs wrap mb-16">
    <button class="tab is-active" data-k="all">全部</button>
    <button class="tab" data-k="pending">待支付</button>
    <button class="tab" data-k="making">制作中</button>
    <button class="tab" data-k="shipped">已发货</button>
    <button class="tab" data-k="done">已完成</button>
    <button class="tab" data-k="aftersale">售后中</button>
    <button class="tab" data-k="closed">已关闭</button>
  </div>

  <div id="order-area"></div>
</main>

<div class="toast-wrap"></div>
<script src="assets/js/store.js"></script>
<script src="assets/js/pricing.js"></script>
<script src="assets/js/ui.js"></script>
<script src="demo/vendor/supabase.min.js"></script>
<script src="demo/config.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  'use strict';
  var $ = UI.qs;
  if (!UI.guard()) return;
  UI.mountNav('orders');

  var filter = 'all';

  UI.qsa('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      UI.qsa('.tab').forEach(function (x) { x.classList.remove('is-active'); });
      t.classList.add('is-active');
      filter = t.dataset.k;
      render();
    });
  });

  function nextAction(o) {
    if (o.status === 'pending') return '<a class="btn btn-primary btn-sm" href="payment.html?id=' + o.id + '">去支付</a>' +
      '<a class="btn btn-outline btn-sm" href="order-detail.html?id=' + o.id + '">订单详情</a>';
    if (o.status === 'shipped' && o.deliveryMethod === 'pickup')
      return '<a class="btn btn-primary btn-sm" href="order-detail.html?id=' + o.id + '">查看取货码</a>';
    if (o.status === 'shipped') return '<a class="btn btn-primary btn-sm" href="logistics.html?id=' + o.id + '">查看物流</a>' +
      '<a class="btn btn-outline btn-sm" href="order-detail.html?id=' + o.id + '">订单详情</a>';
    if (o.status === 'making' || o.status === 'paid' || o.status === 'accepted')
      return '<a class="btn btn-outline btn-sm" href="order-detail.html?id=' + o.id + '">订单详情</a>';
    if (o.status === 'done') return '<button class="btn btn-outline btn-sm" data-again="' + o.id + '">再来一单</button>' +
      '<a class="btn btn-ghost btn-sm" href="order-detail.html?id=' + o.id + '">订单详情</a>';
    if (o.status === 'aftersale')
      return '<a class="btn btn-outline btn-sm" href="order-detail.html?id=' + o.id + '">售后进度</a>';
    return '<button class="btn btn-outline btn-sm" data-again="' + o.id + '">再来一单</button>';
  }

  function statusNote(o) {
    if (o.status === 'pending') return '记得完成付款';
    if (o.status === 'paid') return o.deliveryMethod === 'pickup' ? '等待门店接单' : '等待接单';
    if (o.status === 'accepted') return '已接单，即将制作';
    if (o.status === 'making') return '制作中';
    if (o.status === 'shipped')
      return o.deliveryMethod === 'pickup'
        ? '可以取了'
        : '快递在路上';
    if (o.status === 'done') return o.deliveryMethod === 'pickup' ? '已取货' : '已完成';
    if (o.status === 'aftersale') return '售后处理中';
    if (o.status === 'closed') return '已关闭（超时未支付）';
    return '';
  }

  function render() {
    var local = Store.orders.all();
    var cloud = Cloud.ok() ? Cloud.list() : [];
    /* 合并：云端订单在前，本地旧订单（无 isCloud 标记且不在云端）在后 */
    var cloudIds = {};
    cloud.forEach(function (o) { cloudIds[o.id] = true; });
    var all = cloud.concat(local.filter(function (o) { return !cloudIds[o.id]; }));
    var user = Store.auth.user();
    if (user) {
      /* 只展示本人的云端订单 + 本地订单（演示：按 userId 匹配昵称/手机号） */
      var mineCloud = cloud.filter(function (o) { return o.userId === (user.nickname || user.phone); });
      if (mineCloud.length || cloud.length === 0) all = mineCloud.concat(local.filter(function (o) { return !cloudIds[o.id]; }));
    }
    var list = filter === 'all' ? all : all.filter(function (o) { return o.status === filter; });

    if (!list.length) {
      $('#order-area').innerHTML = '<div class="card">' + UI.empty('order',
        filter === 'all' ? '还没有订单' : '暂无此类订单',
        filter === 'all' ? '作品加入结算袋即可下单。' : '',
        '<a class="btn btn-primary" href="editor.html">去做一张贴纸</a>') + '</div>';
      return;
    }

    $('#order-area').innerHTML = '<div class="stack gap-12">' + list.map(function (o) {
      var thumb = (o.items[0] && o.items[0].thumb) || '';
      var isPickup = o.deliveryMethod === 'pickup';
      /* 本地自提单缺 pickupCode 字段时按订单号现算（与 SQL 规则一致） */
      var pcode = isPickup ? (o.pickupCode || (window.Cloud && Cloud.pickupCodeOf(o.id))) : null;
      return '<div class="card o-card">' +
        '<div class="o-head">' + UI.statusPill(o.status) +
          (isPickup ? '<span class="pill pill-brand">到店自提</span>' : '') +
          '<span class="o-note grow">' + o.id + ' · ' + Store.util.fmtTime(o.createdAt) + '</span>' +
        '</div>' +
        '<div class="row gap-16 mt-12">' +
          '<div class="thumb-sm"><img src="' + thumb + '" alt=""></div>' +
          '<div class="grow">' +
            '<div class="t-sm strong">' + UI.escapeHtml((o.items[0] && o.items[0].name) || '贴纸') +
              (o.items.length > 1 ? ' 等 ' + o.items.length + ' 件' : '') + '</div>' +
            '<div class="t-tiny muted mt-4">共 ' + o.n + ' 张 · 实付 ' + Pricing.fmtYuan(o.amount) + '</div>' +
            '<div class="t-tiny muted mt-4">' + UI.escapeHtml(statusNote(o)) + '</div>' +
            (pcode ? '<span class="o-pickup">取货码 <b>' + pcode + '</b></span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="o-actions">' + nextAction(o) + '</div>' +
      '</div>';
    }).join('') + '</div>';

    UI.qsa('[data-again]').forEach(function (b) {
      b.addEventListener('click', function () {
        var o = Store.orders.get(b.dataset.again) || (Cloud.ok() ? Cloud.get(b.dataset.again) : null);
        if (!o) return;
        // 复用设计：按名字找回作品，找不到就新建一个同名草稿
        var w = null;
        Store.works.history().forEach(function (x) { if (x.name === o.items[0].name) w = x; });
        if (!w) {
          w = { id: Store.util.uid('w'), name: o.items[0].name, kind: 'draft',
                 thumb: o.items[0].thumb, objects: [], updatedAt: Date.now() };
          Store.works.upsert(w);
        }
        Store.bag.add(w.id, 1);
        UI.refreshBagBadge();
        UI.toast('已加入结算袋', 'ok');
        setTimeout(function () { location.href = 'bag.html'; }, 600);
      });
    });
  }

  render();
  /* 云端订单实时刷新（供应商发货/签收后自动更新） */
  if (Cloud.ok()) Cloud.subscribe(function () { render(); });
})();
</script>
</body>
</html>
