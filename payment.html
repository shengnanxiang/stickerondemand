<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付 · SOD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF7A45'/%3E%3Cpath d='M10 11h9l-7 9h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/theme-v2.css">
<style>
  .pay-wrap { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 32px; align-items: start; }
  @media (max-width: 880px) { .pay-wrap { grid-template-columns: 1fr; } }
  .pay-amount { font-size: 44px; font-weight: 900; color: var(--ink); letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .pay-amount .cur { font-size: 22px; margin-right: 2px; }
  .pay-method {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: var(--r-sm); border: 1.5px solid var(--line-strong); background: #fff;
    transition: border-color .16s var(--ease), background .16s var(--ease);
  }
  .pay-method.is-active { border-color: var(--ink); }
  .pay-logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .pay-logo.wx { background: #2AAC52; }
  .pay-logo.ali { background: #1677FF; }
  .pay-count { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--danger); }
  /* 支付成功 · 自提单取货码（与 order-detail 56px 黑框风格统一） */
  .pay-success { text-align: center; }
  .pay-success .s-title { font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .pay-success .s-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); display: grid; place-items: center; }
  .pickup-code-box {
    margin: 18px auto 0; padding: 22px 18px 16px; max-width: 340px; text-align: center;
    border-radius: var(--r-sm); border: 2px solid var(--ink); background: #fff;
  }
  .pickup-code-label { font-size: 13px; font-weight: 700; color: var(--ink-3); letter-spacing: 4px; }
  .pickup-code {
    font-size: 56px; font-weight: 900; letter-spacing: 14px; text-indent: 14px; line-height: 1.1; margin-top: 8px;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .pickup-code-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
  .pickup-store-box {
    margin: 12px auto 0; max-width: 340px; padding: 12px 16px; border-radius: var(--r-xs);
    background: var(--cream-200); font-size: 13px; line-height: 1.7; color: var(--ink-2);
  }
  .pickup-store-box b { color: var(--ink); }
  /* ---- 移动端 App 式专项（配合 theme-v2 全局段） ---- */
  @media (max-width: 760px) {
    .pay-wrap { grid-template-columns: 1fr; }
    .pay-amount { font-size: 38px; }
    .pickup-code { font-size: 48px; letter-spacing: 12px; text-indent: 12px; }
    /* 二维码列移动端隐藏（手机不扫自己屏幕）；桌面叙事保留 */
    .pay-qr-col { display: none; }
    /* 订单摘要行（张数 · 金额 · 倒计时一行） */
    .pay-summary-line { display: flex; align-items: baseline; justify-content: center; gap: 8px; flex-wrap: wrap; }
    #btn-later { margin-top: 70px; }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main class="container-narrow page">
  <div class="row gap-12 mb-16">
    <a class="btn btn-ghost btn-sm" href="bag.html"><span class="ico"></span>返回</a>
  </div>

  <div class="card card-pad-lg" id="pay-card">
    <div class="center" id="pay-head"></div>

    <div class="divider mt-24"></div>

    <div class="pay-wrap mt-24">
      <!-- 左：二维码（仅桌面；移动端隐藏——手机不扫自己屏幕） -->
      <div class="pay-qr-col">
        <div class="center">
          <div class="qr-box"><img id="pay-qr" src="" alt="收款二维码" style="width:100%;height:100%"></div>
          <p class="t-sm muted mt-12" id="qr-tip">扫码支付</p>
        </div>
      </div>

      <!-- 右：支付方式与操作 -->
      <div class="stack gap-12">
        <div class="t-h3">支付方式</div>
        <button class="pay-method is-active" data-pay="wx">
          <span class="pay-logo wx" id="l-wx"></span>
          <span class="col grow"><span class="t-sm strong">微信支付</span>
          <span class="t-tiny muted">推荐</span></span>
          <span class="pill pill-mint">已选</span>
        </button>
        <button class="pay-method" data-pay="ali">
          <span class="pay-logo ali" id="l-ali"></span>
          <span class="col grow"><span class="t-sm strong">支付宝</span>
          <span class="t-tiny muted">跳转至支付宝</span></span>
        </button>

        <div class="notice notice-sun" style="display:flex;gap:10px">
          <span class="notice-icon" id="i-info"></span>
          <span>演示环境：点下方按钮完成支付。</span>
        </div>

        <button class="btn btn-primary btn-xl btn-block mt-8" id="btn-paid">完成支付</button>
        <button class="btn btn-ghost btn-block" id="btn-later">稍后再付</button>
      </div>
    </div>
  </div>
</main>

<div class="toast-wrap"></div>
<script src="assets/js/store.js"></script>
<script src="assets/js/pricing.js"></script>
<script src="assets/js/ui.js"></script>
<script src="demo/vendor/supabase.min.js"></script>
<script src="demo/config.js"></script>
<script src="assets/js/cloud.js"></script>
<script>
(function () {
  'use strict';
  var $ = UI.qs;
  if (!UI.guard()) return;
  UI.mountNav('bag');
  UI.qsa('.row .ico').forEach(function (i) { i.innerHTML = UI.icon('chevronL'); });
  $('#l-wx').innerHTML = UI.icon('wechat');
  $('#l-ali').innerHTML = UI.icon('qr');
  $('#i-info').innerHTML = UI.icon('info');

  var orderId = UI.param('id');
  var order = Store.orders.get(orderId);
  if (!order && Cloud.ok()) order = Cloud.get(orderId);

  /* 自提单取货码（本地单直接取；云端单优先 mapOrder 的 pickupCode） */
  function pickupCodeOf(o) {
    if (!o) return null;
    if (o.pickupCode) return o.pickupCode;
    if (o.deliveryMethod !== 'pickup' && o.id && UI.param('dm') !== 'pickup') return null;
    return Cloud.pickupCodeOf(o.id);
  }
  function isPickup(o) { return !!(o && (o.deliveryMethod === 'pickup' || UI.param('dm') === 'pickup')); }

  function renderHead(o) {
    $('#pay-head').innerHTML =
      '<div class="t-sm muted">请支付</div>' +
      '<div class="pay-amount mt-4"><span class="cur">¥</span>' + Pricing.fmt(o.amount) + '</div>' +
      '<div class="pay-summary-line mt-8">' +
        '<span class="t-tiny muted">' + o.n + ' 张</span>' +
        '<span class="t-tiny muted">·</span>' +
        (isPickup(o) ? '<span class="t-tiny muted">到店自提</span><span class="t-tiny muted">·</span>' : '') +
        '<span class="t-tiny muted">' + o.id + '</span>' +
        '<span class="t-tiny muted">·</span>' +
        '<span class="t-tiny muted">剩余 <span class="pay-count" id="pay-count">15:00</span></span>' +
      '</div>';
    /* 吸底按钮带金额（移动端 App 式「立即支付 ¥xx.xx」） */
    var bp = $('#btn-paid');
    if (bp) bp.textContent = '立即支付 ¥' + Pricing.fmt(o.amount);
  }

  /* 云端单首次进入可能尚未拉到：subscribe 等首次数据到达再渲染；本地单直接渲染 */
  if (order) {
    renderHead(order); startPay(order);
  } else if (Cloud.ok()) {
    var once = function () {
      var o = Cloud.get(orderId);
      if (!o) return; /* 首次 fetch 完成仍没有 → 真不存在，稍后统一 redirect */
      Cloud.subscribe(once).unsubscribe();
      order = o;
      renderHead(order); startPay(order);
    };
    var sub = Cloud.subscribe(once);
    setTimeout(function () {
      if (!order) {
        sub.unsubscribe();
        location.href = 'orders.html';
      }
    }, 4000);
  } else {
    location.href = 'orders.html';
    return;
  }

  /* ---- 支付成功 · 自提单展示大字号取货码 ---- */
  function showSuccess(o) {
    var store = (Cloud.pickupStore && Cloud.ok() && Cloud.pickupStore()) || (Cloud.demoStore) ||
      { name: '上海徐汇工作室', address: '上海市徐汇区漕溪北路 100 号 1 层', openHours: '09:00 - 20:00' };
    var code = pickupCodeOf(o) || Cloud.pickupCodeOf(o.id);
    var ready = o.readyAt || Cloud.readyAtFrom(o.createdAt || Date.now());
    var rt = new Date(ready);
    var readyTxt = '今日 ' + rt.getHours() + ':' + (rt.getMinutes() < 10 ? '0' : '') + rt.getMinutes();
    if (rt.toDateString() !== new Date().toDateString())
      readyTxt = (rt.getMonth() + 1) + '-' + rt.getDate() + ' ' + rt.getHours() + ':' + (rt.getMinutes() < 10 ? '0' : '') + rt.getMinutes();
    $('#pay-card').innerHTML =
      '<div class="pay-success">' +
        '<div class="s-title"><span class="s-icon">' + UI.icon('check') + '</span>支付成功</div>' +
        '<div class="t-tiny muted mt-8">' + o.id + '</div>' +
        '<div class="pickup-code-box">' +
          '<div class="pickup-code-label">取货码</div>' +
          '<div class="pickup-code">' + code + '</div>' +
          '<div class="pickup-code-sub">' + readyTxt + ' 后可取</div>' +
        '</div>' +
        '<div class="pickup-store-box">' +
          '<b>' + UI.escapeHtml(store.name) + '</b> · ' + UI.escapeHtml(store.openHours) + '<br>' +
          UI.escapeHtml(store.address) +
        '</div>' +
        '<div class="row gap-12 mt-16" style="justify-content:center">' +
          '<a class="btn btn-primary" href="order-detail.html?id=' + o.id + '">查看订单</a>' +
          '<a class="btn btn-ghost" href="home.html">继续逛逛</a>' +
        '</div>' +
      '</div>';
  }

  /* ---- 发起支付流程 ---- */
  function startPay(o) {
    var method = 'wx';
    function setQR() {
      var color = method === 'wx' ? '#2AAC52' : '#1677FF';
      $('#pay-qr').src = Store.assets.svgURI(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#fff"/>' +
        '<g fill="' + color + '">' +
        '<path d="M8 8h9v9H8zM23 8h9v9h-9zM8 23h9v9H8z"/>' +
        '<path d="M83 8h9v9h-9zM68 8h9v9h-9zM83 23h9v9h-9z"/>' +
        '<path d="M8 83h9v9H8zM23 83h9v9h-9zM8 68h9v9H8z"/>' +
        Array.apply(null, { length: 196 }).map(function (_, i) {
          var x = i % 14, y = Math.floor(i / 14);
          var v = Math.abs(Math.sin(x * 12.9898 + y * 78.233 + (method === 'wx' ? 0 : 3.3)) * 43758.5453) % 1;
          if (v < 0.5) return '';
          if (x < 5 && y < 5) return ''; if (x > 8 && y < 5) return ''; if (x < 5 && y > 8) return '';
          return '<rect x="' + (30 + x * 3.2) + '" y="' + (30 + y * 3.2) + '" width="2.8" height="2.8"/>';
        }).join('') +
        '</g></svg>');
      $('#qr-tip').textContent = (method === 'wx' ? '微信' : '支付宝') + '扫码支付';
    }
    setQR();

    UI.qsa('[data-pay]').forEach(function (b) {
      b.addEventListener('click', function () {
        method = b.dataset.pay;
        UI.qsa('[data-pay]').forEach(function (x) {
          x.classList.remove('is-active');
          var p = x.querySelector('.pill'); if (p) p.remove();
        });
        b.classList.add('is-active');
        b.insertAdjacentHTML('beforeend', '<span class="pill pill-mint">已选</span>');
        setQR();
      });
    });

    // 支付倒计时
    var left = 15 * 60;
    var t = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(t);
        var pc = $('#pay-count');
        if (pc) pc.textContent = '订单已超时';
        var bp = $('#btn-paid'); if (bp) bp.disabled = true;
        return;
      }
      var m = Math.floor(left / 60), s = left % 60;
      var pc2 = $('#pay-count');
      if (pc2) pc2.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }, 1000);

    $('#btn-paid').addEventListener('click', function () {
      clearInterval(t);
      var btn = $('#btn-paid');
      btn.disabled = true; btn.textContent = '支付中…';
      Store.orders.payCloud(order.id).then(function (r) {
        if (r && r.ok) {
          UI.toast('支付成功', 'ok');
          /* 自提单：展示大字号取货码成功页；快递单：跳订单详情（原行为） */
          if (isPickup(order)) {
            var fresh = Store.orders.get(order.id) || (Cloud.ok() ? Cloud.get(order.id) : null) || order;
            setTimeout(function () { showSuccess(fresh); }, 500);
          } else {
            setTimeout(function () { location.href = 'order-detail.html?id=' + order.id; }, 600);
          }
        } else {
          btn.disabled = false; btn.textContent = '立即支付 ¥' + Pricing.fmt(order.amount);
          UI.toast((r && r.msg) || '支付失败，请重试', 'err');
        }
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = '立即支付 ¥' + Pricing.fmt(order.amount);
        UI.toast('云端连接失败：' + (e.message || e), 'err');
      });
    });
    $('#btn-later').addEventListener('click', function () {
      UI.toast('订单已保留，可在「我的订单」继续支付');
      setTimeout(function () { location.href = 'orders.html'; }, 600);
    });
  }
})();
</script>
</body>
</html>
