<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商家登录 · SOD 供应端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF7A45'/%3E%3Cpath d='M10 11h9l-7 9h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="biz-login-bg">
  <div class="biz-login-card">
    <div class="biz-login-logo">
      <span class="logo" id="l-logo"></span>
      <span class="col"><span class="name">SOD 供应端</span>
      <span class="t-tiny muted">商家工作台 · 处理你的贴纸订单</span></span>
    </div>

    <div class="stack gap-14 mt-24">
      <div>
        <label class="t-sm strong" for="f-shop">选择店铺</label>
        <select class="input mt-8" id="f-shop"></select>
      </div>
      <div>
        <label class="t-sm strong" for="f-pwd">密码</label>
        <input class="input mt-8" id="f-pwd" type="password" placeholder="演示密码 123456" autocomplete="current-password">
      </div>
      <div class="notice notice-sun" style="display:flex;gap:10px">
        <span class="notice-icon" id="i-info"></span>
        <span class="t-tiny">原型演示：密码统一 <b>123456</b>，登录即进入工作台。</span>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="btn-login">进入工作台</button>
      <a class="btn btn-ghost btn-block" href="../index.html">返回门户</a>
    </div>
  </div>
</div>

<div class="toast-wrap"></div>
<script src="../demo/vendor/supabase.min.js"></script>
<script src="../demo/config.js"></script>
<script src="biz-sdk.js"></script>
<script>
(function () {
  'use strict';
  var $ = BizUtil.qs;

  /* 复用主站 UI 的图标与提示风格（不依赖 Store） */
  document.getElementById('l-logo').innerHTML =
    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h6"/><path d="M15 22l6-6-6-6"/><circle cx="21" cy="16" r="3"/></svg>';
  document.getElementById('i-info').innerHTML =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>';

  /* 已登录直接进工作台 */
  if (Biz.session) { location.replace('index.html'); return; }

  var shopSel = $('#f-shop');
  Biz.listSuppliers().then(function (list) {
    if (!list.length) {
      shopSel.innerHTML = '<option value="">（云端还没有店铺，请先执行 supabase/biz-schema.sql）</option>';
      return;
    }
    shopSel.innerHTML = list.map(function (s) {
      return '<option value="' + BizUtil.escapeHtml(s.id) + '">' +
        BizUtil.escapeHtml(s.name) + '（' + BizUtil.escapeHtml(s.id) + '）</option>';
    }).join('');
  });

  function doLogin() {
    var id = shopSel.value;
    var pwd = $('#f-pwd').value.trim();
    if (!id) { BizUtil.toast('请选择店铺', 'warn'); return; }
    if (!pwd) { BizUtil.toast('请输入密码', 'warn'); return; }
    var btn = $('#btn-login');
    btn.disabled = true; btn.textContent = '登录中…';
    Biz.login(id, pwd).then(function (r) {
      if (r && r.ok) {
        BizUtil.toast('欢迎回来，' + r.name, 'ok');
        setTimeout(function () { location.href = 'index.html'; }, 400);
      } else {
        BizUtil.toast((r && r.msg) || '登录失败', 'err');
        btn.disabled = false; btn.textContent = '进入工作台';
      }
    }).catch(function (e) {
      BizUtil.toast('云端连接失败：' + (e.message || e), 'err');
      btn.disabled = false; btn.textContent = '进入工作台';
    });
  }
  $('#btn-login').addEventListener('click', doLogin);
  $('#f-pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
})();
</script>
</body>
</html>
